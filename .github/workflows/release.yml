name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.COUCH_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "COUCH_KEYSTORE_BASE64 secret is missing" >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/couch.jks"
      - name: Build, test and sign
        env:
          COUCH_KEYSTORE: ${{ runner.temp }}/couch.jks
          COUCH_KEYSTORE_PASSWORD: ${{ secrets.COUCH_KEYSTORE_PASSWORD }}
          COUCH_KEY_ALIAS: ${{ secrets.COUCH_KEY_ALIAS }}
          COUCH_KEY_PASSWORD: ${{ secrets.COUCH_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease testReleaseUnitTest
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="couch-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          # couch.apk keeps one name across releases, so releases/latest/download/couch.apk always works.
          cp "$apk" couch.apk
          gh release create "$TAG" "$apk" "$apk.sha256" couch.apk --title "Couch ${TAG#v}" --generate-notes --verify-tag
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/couch.jks"
